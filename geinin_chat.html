<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナンバズのシン - 後輩芸人トーク</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
  :root {
    --green: #06C755;
    --green-dark: #05a847;
    --bg: #f0f0f0;
    --shin-bubble: #ffffff;
    --ken-bubble: #e8f5e9;
    --user-bubble: #06C755;
    --text: #1a1a1a;
    --sub: #888;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .phone-frame {
    width: 390px; height: 844px;
    background: var(--bg);
    border-radius: 48px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.25), 0 0 0 2px #ccc;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .header {
    background: var(--green);
    padding: 14px 16px 12px;
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .header-back { color: white; font-size: 20px; opacity: 0.9; }
  .header-avatars { display: flex; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; color: white; flex-shrink: 0;
  }
  .avatar-shin { background: linear-gradient(135deg, #ff6b35, #f7931e); border: 2px solid white; }
  .avatar-ken  { background: linear-gradient(135deg, #2c3e50, #34495e); border: 2px solid white; margin-left: -8px; }
  .header-info { flex: 1; }
  .header-name { color: white; font-weight: 700; font-size: 15px; letter-spacing: .05em; }
  .header-sub  { color: rgba(255,255,255,.8); font-size: 11px; margin-top: 1px; }
  .chat-area {
    flex: 1; overflow-y: auto;
    padding: 16px 12px;
    display: flex; flex-direction: column; gap: 14px;
    background: var(--bg);
  }
  .chat-area::-webkit-scrollbar { width: 3px; }
  .chat-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
  .date-divider {
    text-align: center; font-size: 11px; color: var(--sub);
    background: rgba(0,0,0,.06); border-radius: 12px;
    padding: 4px 12px; align-self: center;
  }
  .hint {
    text-align: center; font-size: 11px; color: var(--sub);
    background: rgba(0,0,0,.04); border-radius: 12px;
    padding: 6px 14px; align-self: center; line-height: 1.6;
  }
  .msg-group { display: flex; flex-direction: column; gap: 4px; }
  .msg-group.user { align-items: flex-end; }
  .msg-group.bot  { align-items: flex-start; }
  .msg-row { display: flex; align-items: flex-end; gap: 6px; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 900; color: white;
    align-self: flex-start; margin-top: 18px;
  }
  .msg-avatar.shin { background: linear-gradient(135deg, #ff6b35, #f7931e); }
  .msg-avatar.ken  { background: linear-gradient(135deg, #2c3e50, #34495e); }
  .msg-content { display: flex; flex-direction: column; gap: 3px; max-width: 72%; }
  .speaker-name { font-size: 10px; color: var(--sub); margin-left: 4px; }
  .bubble {
    padding: 10px 14px; border-radius: 18px;
    font-size: 13.5px; line-height: 1.65;
    word-break: break-word; white-space: pre-wrap;
    animation: popIn .2s ease;
  }
  @keyframes popIn {
    from { transform: scale(.92); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .bubble.shin { background: var(--shin-bubble); color: var(--text); border-radius: 4px 18px 18px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .bubble.ken  { background: var(--ken-bubble);  color: var(--text); border-radius: 4px 18px 18px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .bubble.user { background: var(--user-bubble); color: white; border-radius: 18px 4px 18px 18px; }
  .typing-bubble {
    background: white; border-radius: 4px 18px 18px 18px;
    padding: 12px 16px; display: flex; gap: 4px; align-items: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); animation: popIn .2s ease;
  }
  .dot { width: 7px; height: 7px; background: #bbb; border-radius: 50%; animation: bounce 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-6px); background: #06C755; }
  }
  .unknown-bubble {
    background: #fff8e1; color: #999; border-radius: 12px;
    padding: 10px 14px; font-size: 12px; align-self: center; text-align: center;
    animation: popIn .2s ease;
  }
  .input-area {
    background: #fff; border-top: 1px solid #e0e0e0;
    padding: 10px 12px 16px;
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .input-wrap {
    flex: 1; background: #f5f5f5; border-radius: 24px;
    display: flex; align-items: center; padding: 0 14px; min-height: 40px;
  }
  .input-field {
    flex: 1; border: none; background: transparent;
    font-family: 'Noto Sans JP', sans-serif; font-size: 14px;
    color: var(--text); outline: none; padding: 8px 0;
    resize: none; max-height: 80px;
  }
  .input-field::placeholder { color: #bbb; }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--green); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; flex-shrink: 0;
  }
  .send-btn:hover  { background: var(--green-dark); transform: scale(1.05); }
  .send-btn:active { transform: scale(.95); }
  .send-btn svg { width: 18px; height: 18px; fill: white; }
  @media (max-width: 430px) {
    .phone-frame { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
  }
</style>
</head>

<div class="phone-frame">

    <div class="input-wrap">

    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

function normalize(s) {
  return s.replace(/\s|　/g,'').toLowerCase()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}

function findResponse(input) {
  const q = normalize(input);
  for (const key of Object.keys(RESPONSES)) {
    if (q.includes(normalize(key))) return RESPONSES[key];
  }
  return null;
}

const inputField = document.getElementById('inputField');

inputField.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputField.addEventListener('input', () => {
  inputField.style.height = 'auto';
  inputField.style.height = Math.min(inputField.scrollHeight, 80) + 'px';
});

function addUserMessage(text) {
  const g = document.createElement('div');
  g.className = 'msg-group user';
  const row = document.createElement('div');
  row.className = 'msg-row user';
  const b = document.createElement('div');
  b.className = 'bubble user';
  b.textContent = text;
  row.appendChild(b); g.appendChild(row);
  chatArea.appendChild(g); scrollBottom();
}

function addTypingEl(who) {
  const g = document.createElement('div');
  g.className = 'msg-group bot';
  const row = document.createElement('div');
  row.className = 'msg-row';
  const av = document.createElement('div');
  av.className = 'msg-avatar ' + who;
  av.textContent = who === 'shin' ? 'シ' : 'ケ';
  const t = document.createElement('div');
  t.className = 'typing-bubble';
  t.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  row.appendChild(av); row.appendChild(t); g.appendChild(row);
  chatArea.appendChild(g); scrollBottom();
  return g;
}

function addBubble(who, text) {
  const g = document.createElement('div');
  g.className = 'msg-group bot';
  const row = document.createElement('div');
  row.className = 'msg-row';
  const av = document.createElement('div');
  av.className = 'msg-avatar ' + who;
  av.textContent = who === 'shin' ? 'シ' : 'ケ';
  const wrap = document.createElement('div');
  wrap.className = 'msg-content';
  const name = document.createElement('div');
  name.className = 'speaker-name';
  name.textContent = who === 'shin' ? 'シン' : 'ケン';
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  b.textContent = text;
  wrap.appendChild(name); wrap.appendChild(b);
  row.appendChild(av); row.appendChild(wrap); g.appendChild(row);
  chatArea.appendChild(g); scrollBottom();
}

function scrollBottom() {
  setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
}

let busy = false;

async function sendMessage() {
  if (busy) return;
  const text = inputField.value.trim();
  if (!text) return;
  inputField.value = '';
  inputField.style.height = 'auto';
  busy = true;

  addUserMessage(text);

  const lines = findResponse(text);
  if (!lines) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'unknown-bubble';
      el.textContent = '…知ってる芸人の名前、送ってみてな';
      chatArea.appendChild(el);
      scrollBottom();
      busy = false;
    }, 400);
    return;
  }

  for (const line of lines) {
    await new Promise(resolve => {
      const typing = addTypingEl(line.who);
      const wait = 500 + line.text.length * 16;
      setTimeout(() => {
        typing.remove();
        addBubble(line.who, line.text);
        resolve();
      }, wait);
    });
    await new Promise(r => setTimeout(r, 250));
  }
  busy = false;
}
</script>
