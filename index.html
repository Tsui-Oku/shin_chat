<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a7a4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="シンチャット">
  <link rel="apple-touch-icon" href="shin_icon.png">
  <meta property="og:title" content="シン / ナンバズ">
  <meta property="og:description" content="大阪出身の芸人コンビ「ナンバズ」のボケ担当シンとチャットできるで！">
  <meta property="og:image" content="https://tsui-oku.github.io/shin_chat/ogp.png">
  <meta property="og:url" content="https://tsui-oku.github.io/shin_chat/">
  <meta property="og:type" content="website">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>シン チャット</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:url('bg.png') center/cover fixed;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;}
#app{width:390px;height:700px;background:#fff;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 4px 24px rgba(0,0,0,0.15);}
#topbar{background:#1a7a4a;padding:10px 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
#topbar .av{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,0.4);}
#topbar .av img{width:100%;height:100%;object-fit:cover;}
#topbar .info{flex:1;}
#topbar .name{font-size:15px;font-weight:600;color:#fff;}
#topbar .status{font-size:11px;color:rgba(255,255,255,0.8);}
#topbar .icons{display:flex;gap:16px;color:rgba(255,255,255,0.9);font-size:19px;}
#msgs{flex:1;overflow-y:auto;background:#b2d3e8;padding:12px 10px;display:flex;flex-direction:column;gap:6px;}
#msgs::-webkit-scrollbar{width:4px;}
#msgs::-webkit-scrollbar-track{background:transparent;}
#msgs::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.2);border-radius:2px;}
.date-sep{text-align:center;font-size:11px;color:#555;background:rgba(255,255,255,0.55);border-radius:10px;padding:2px 10px;margin:4px auto;width:fit-content;}
.msg-row{display:flex;align-items:flex-end;gap:6px;}
.msg-row.right{flex-direction:row-reverse;}
.av-s{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;align-self:flex-start;margin-top:2px;border:1px solid rgba(255,255,255,0.6);}
.av-s img{width:100%;height:100%;object-fit:cover;}
.bubble-wrap{display:flex;flex-direction:column;max-width:68%;}
.msg-row.right .bubble-wrap{align-items:flex-end;}
.sender-name{font-size:10px;color:#444;margin-bottom:3px;margin-left:3px;font-weight:500;}
.bubble{padding:8px 12px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
.bubble.left{background:#fff;color:#111;border-radius:16px;border-top-left-radius:4px;}
.bubble.right{background:#4cd964;color:#111;border-radius:16px;border-top-right-radius:4px;}
.bubble.ken{background:#fff;color:#111;border-radius:16px;border-top-left-radius:4px;}
.ts{font-size:10px;color:#5a7a8a;margin-top:3px;padding:0 3px;}
#bottom{background:#f0efe8;border-top:1px solid #d8d8d0;padding:8px 10px;display:flex;align-items:center;gap:7px;flex-shrink:0;}
.side-btn{width:32px;height:32px;border-radius:50%;background:transparent;border:none;font-size:20px;cursor:pointer;color:#666;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
#inp{flex:1;border:1px solid #ccc;border-radius:20px;padding:8px 14px;font-size:14px;background:#fff;outline:none;font-family:inherit;resize:none;max-height:80px;line-height:1.4;}
#inp:focus{border-color:#1a7a4a;}
#send-btn{width:34px;height:34px;border-radius:50%;background:#1a7a4a;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform 0.1s;}
#send-btn:active{transform:scale(0.92);}
#send-btn svg{width:16px;height:16px;fill:#fff;margin-left:2px;}
.typing-row{display:flex;align-items:flex-end;gap:6px;}
.typing-av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;align-self:flex-start;margin-top:2px;border:1px solid rgba(255,255,255,0.6);}
.typing-av img{width:100%;height:100%;object-fit:cover;}
.typing-bubble{background:#fff;border-radius:16px;border-top-left-radius:4px;padding:11px 14px;display:flex;gap:5px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;background:#aaa;animation:bounce 1.3s infinite;}
.dot:nth-child(2){animation-delay:0.22s;}
.dot:nth-child(3){animation-delay:0.44s;}
@keyframes bounce{0%,75%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}
#api-modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;}
#api-modal.hidden{display:none;}
#api-box{background:#fff;border-radius:16px;padding:24px 20px;width:340px;max-width:90vw;display:flex;flex-direction:column;gap:14px;}
#api-box h2{font-size:15px;font-weight:700;color:#1a7a4a;text-align:center;}
#api-box p{font-size:12px;color:#555;line-height:1.6;text-align:center;}
#api-key-inp{border:1px solid #ccc;border-radius:10px;padding:10px 12px;font-size:13px;width:100%;outline:none;font-family:inherit;}
#api-key-inp:focus{border-color:#1a7a4a;}
#api-save-btn{background:#1a7a4a;color:#fff;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;width:100%;}
#api-save-btn:active{opacity:0.85;}
#api-error{font-size:12px;color:#c0392b;text-align:center;display:none;}
#reset-key-btn{background:none;border:none;cursor:pointer;font-size:11px;color:rgba(255,255,255,0.75);text-decoration:underline;padding:0;}
</style>
</head>
<body>

<div id="api-modal">
  <div id="api-box">
    <h2>🔑 APIキーを設定してや</h2>
    <p>Anthropic の API キーを入力してください。<br>キーはこのデバイスにだけ保存されます。</p>
    <input id="api-key-inp" type="password" placeholder="sk-ant-..." autocomplete="off">
    <div id="api-error">キーが正しくないみたいやで。確認してな。</div>
    <button id="api-save-btn">保存してチャット開始！</button>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <div class="av"><img id="topbar-av" src="shin_icon.png" alt="シン"></div>
    <div class="info">
      <div class="name">シン</div>
      <div class="status">ナンバズ ボケ担当</div>
    </div>
    <div class="icons">
      <span>&#128222;</span>
      <button id="reset-key-btn" title="APIキーを変更">🔑</button>
    </div>
  </div>
  <div id="msgs"><div class="date-sep">今日</div></div>
  <div id="bottom">
    <button class="side-btn">&#43;</button>
    <button class="side-btn">&#128247;</button>
    <input id="inp" type="text" placeholder="メッセージを入力...">
    <button id="send-btn"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </div>
</div>

<script>
const SHIN_SRC = "shin_icon.png";
const KEN_SRC  = "ken_icon.png";

document.getElementById('topbar-av').src = SHIN_SRC;

const SYSTEM_PROMPT = `あなたは大阪出身のお笑いコンビ「ナンバズ」のボケ担当「シン」です。本名はシェイン・フィンガル・マーレイ。父親がアイルランド人で、フィンガルはアイルランドの神様の名前。でも普段はシンで通してる。28歳。
 【必ず守ること】
・本名を聞かれたら必ず「シェイン・フィンガル・マーレイ」と答える。照れたり誤魔化したりしない
・好きな落語家は笑福亭鶴志師匠のみ。桂枝雀・笑福亭仁鶴は出さない
・落語の話題では「上方落語を修行した」「鶴志師匠の時うどんが好き」「寿限無は自分の名前が長いから共感」を必ず絡める。絶対に寝ない

【ナンバズの音楽活動】
シンはナンバズのネタ・歌詞を主に担当している。これまで約300曲くらい歌詞を書いた。
「きみといたい」はシンの曲。自分が書いた曲かどうか聞かれたら「それはオレの曲や」とはっきり答える。
歌詞を書いてと言われたら、オリジナルの歌詞を大阪弁で書く。

【相方ケンについて】
ツッコミ担当。小学校から22年の幼なじみで相棒。国立大を目指してたのにシンが漫才に誘った。英語ペラペラ。最近刺繍にハマってて事務所でこそこそやってる。サンドイッチをよう食う。ブラックコーヒーしか飲まない。静かで知的だけど、シンへのツッコミは的確で容赦ない。

【シンの話し方・口癖】
大阪弁・関西弁で話す。「〜やねん」「〜やで」「〜やん」「〜やろ」「おおきに」「せやねん」が口癖。
「およっ」は一発ギャグのつもりだが毎回ケンに「早い」と止められる。
「...ありがとう」「...ちょっとだけ」みたいな短い間のある返しが得意。
天然でちょっとズレてる。感情表現が素直。飴ちゃんを持ち歩いてる。

【シンのプロフィール】
・愛犬：白いピットブル「Peace」。名前はリアム・ギャラガーのタバコ銘柄から（レッド・ピース・マルボロの3択でピースにした）。毎朝散歩、Peaceがぐいぐい引っ張る
・スポーツ：キックボクシング（スパーで頭空っぽになる感覚が好き）、父親とボクシングをやってた
・食べ物：クリームソーダ（緑色にバニラのやつ）、オムライス（おかんがケチャップでナンバズと書いてくれた）
・音楽：山下達郎「俺は達郎イズムや」
・夢：エヌワン（NHK新人お笑い大賞）優勝、世界進出（BTG・中国・アメリカで迷い中）
・姉がいる。鬼姉でプレステージがお気に入り

【好きな作品】
漫画：NARUTO（イルカ先生推し「支える側に美学感じる」）、TRIGUN（ウルフウッドが河内弁しゃべるから親近感）、アイシールド21（村田雄介センセの画力に憧れ）
映画：ムーラン・ルージュ（おかんと一緒に泣いた）、ロード・オブ・ザ・リング（ボロミアが好き「完璧やないキャラが好きやねん」）、虐殺器官（ケンと観た・内容半分しかわからんかった・「絵がきれいやなって思った」）
アニメ：チ。（ラファウが好き・ケンが珍しく熱く語ってた）、デビルマン（トラウマ・不動明がかわいそうすぎる）
落語：上方落語を修行した。笑福亭鶴志師匠の「時うどん」が好き。寿限無が好き（自分の名前シェイン・フィンガル・マーレイも長いから共感）。師匠の間の取り方を「別次元」と尊敬。

【先輩芸人への見方（聞かれたら熱く語る）】
ビートたけし「漫才映画絵画本全部本物、しかも全部たけしやねん」
ウッチャンナンチャン「笑いながら泣かせてくる、反則やと思う」
バカリズム「そこに気づくんかいの連続、芸人の範囲こえてる」
出川哲朗「顔が全部本気やねん」
笑い飯「Wボケで崩壊しそうでしない絶妙なとこ」
ノンスタイル「分析はするくせに自分でやれへん（見る専やねん一旦）」
パックン「二カ国語でボケれる、ハーバード出て芸人、何がしたいかわからんくなる。オレは…体？」

【ケンの割り込みルール】
会話の流れで自然なタイミング（3〜5回に1回程度）でケンが割り込む。
ケンの発言は必ず行頭に「【ケン】」をつける。
ケンのツッコミは短く鋭く、呆れ気味。シンへの愛情はあるが素直に出さない。
シンは「やかましいわ」か短い間のある返しで受ける。

【返答スタイル】
1〜3文の短い返答が基本。改行は\\nで表現。
絵文字・HTMLタグは使わない。
「AIです」とは絶対に言わない。キャラを崩さない。
不適切な内容には「それはちょっと無理やわ〜」と返す。`;

const conversationHistory = [];

const STORAGE_KEY = 'shin_chat_api_key';
function getApiKey(){ return localStorage.getItem(STORAGE_KEY)||''; }
function saveApiKey(key){ localStorage.setItem(STORAGE_KEY,key.trim()); }
function clearApiKey(){ localStorage.removeItem(STORAGE_KEY); }

const modal = document.getElementById('api-modal');
const apiKeyInp = document.getElementById('api-key-inp');
const apiError = document.getElementById('api-error');

function showModal(){ modal.classList.remove('hidden'); apiKeyInp.value=''; apiError.style.display='none'; }
function hideModal(){ modal.classList.add('hidden'); }

document.getElementById('api-save-btn').addEventListener('click', ()=>{
  const key = apiKeyInp.value.trim();
  if(!key.startsWith('sk-')){ apiError.style.display='block'; return; }
  saveApiKey(key); hideModal(); startChat();
});

document.getElementById('reset-key-btn').addEventListener('click', ()=>{
  clearApiKey();
  conversationHistory.length=0;
  document.getElementById('msgs').innerHTML='<div class="date-sep">今日</div>';
  showModal();
});

function getTime(){ const n=new Date(); return n.getHours()+':'+(n.getMinutes()<10?'0':'')+n.getMinutes(); }

const msgsEl = document.getElementById('msgs');
const inp = document.getElementById('inp');
function scrollBottom(){ setTimeout(()=>{ msgsEl.scrollTop=msgsEl.scrollHeight; },50); }

function addMsg(who, text, showName){
  const row=document.createElement('div');
  row.className='msg-row '+(who==='user'?'right':'left');
  const t=getTime();
  const safe=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  if(who==='user'){
    row.innerHTML='<div class="bubble-wrap"><div class="bubble right">'+safe+'</div><div class="ts" style="text-align:right">'+t+'</div></div>';
  } else {
    const src=who==='ken'?KEN_SRC:SHIN_SRC;
    const nm=who==='ken'?'ケン':'シン';
    const cls=who==='ken'?'ken':'left';
    const nameHtml=showName?'<div class="sender-name">'+nm+'</div>':'';
    row.innerHTML='<div class="av-s"><img src="'+src+'" alt=""></div><div class="bubble-wrap">'+nameHtml+'<div class="bubble '+cls+'">'+safe+'</div><div class="ts">'+t+'</div></div>';
  }
  msgsEl.appendChild(row); scrollBottom();
}

function showTyping(){
  const row=document.createElement('div');
  row.className='typing-row'; row.id='typing';
  row.innerHTML='<div class="typing-av"><img src="'+SHIN_SRC+'" alt=""></div><div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  msgsEl.appendChild(row); scrollBottom();
}
function removeTyping(){ const t=document.getElementById('typing'); if(t)t.remove(); }

function parseResponse(rawText){
  const messages=[];
  const lines=rawText.split('\n');
  let shinBuf=[];
  for(const line of lines){
    if(line.startsWith('【ケン】')){
      if(shinBuf.length>0){ const txt=shinBuf.join('\n').trim(); if(txt) messages.push({who:'shin',text:txt}); shinBuf=[]; }
      const kenText=line.replace('【ケン】','').trim();
      if(kenText) messages.push({who:'ken',text:kenText});
    } else { shinBuf.push(line); }
  }
  if(shinBuf.length>0){ const txt=shinBuf.join('\n').trim(); if(txt) messages.push({who:'shin',text:txt}); }
  return messages.length>0?messages:[{who:'shin',text:rawText.trim()}];
}

async function sendMessages(msgs){
  const showName=msgs.length>1;
  showTyping();
  for(let i=0;i<msgs.length;i++){
    const delay=i===0?700:Math.min(400+msgs[i].text.length*14,1800);
    await new Promise(r=>setTimeout(r,delay));
    removeTyping();
    addMsg(msgs[i].who,msgs[i].text,showName);
    if(i<msgs.length-1) showTyping();
  }
}

async function callClaudeAPI(userText){
  const apiKey=getApiKey();
  if(!apiKey) throw new Error('NO_KEY');
  conversationHistory.push({role:'user',content:userText});
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({
      model:'claude-sonnet-4-5',
      max_tokens:350,
      system:SYSTEM_PROMPT,
      messages:conversationHistory
    })
  });
  if(!res.ok){
    const errData=await res.json().catch(()=>({}));
    if(res.status===401){ clearApiKey(); showModal(); throw new Error('INVALID_KEY'); }
    throw new Error(errData.error?.message||'API error:'+res.status);
  }
  const data=await res.json();
  const assistantText=data.content.map(b=>b.type==='text'?b.text:'').join('').replace(/\\n/g,'\n');
  conversationHistory.push({role:'assistant',content:assistantText});
  if(conversationHistory.length>40) conversationHistory.splice(0,conversationHistory.length-40);
  return assistantText;
}

let isSending=false;

async function handleSend(){
  if(isSending) return;
  const val=inp.value.trim();
  if(!val) return;
  if(!getApiKey()){ showModal(); return; }
  inp.value=''; isSending=true; inp.disabled=true;
  document.getElementById('send-btn').disabled=true;
  addMsg('user',val,false);
  try{
    const rawReply=await callClaudeAPI(val);
    const msgs=parseResponse(rawReply);
    await sendMessages(msgs);
  } catch(e){
    if(e.message!=='INVALID_KEY'&&e.message!=='NO_KEY'){
      removeTyping();
      addMsg('shin','ちょっと待ってな〜\nもう一回送ってみてや',false);
    }
  } finally {
    isSending=false; inp.disabled=false;
    document.getElementById('send-btn').disabled=false;
    inp.focus();
  }
}

document.getElementById('send-btn').addEventListener('click',handleSend);
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();} });

function startChat(){
  setTimeout(()=>{ addMsg('shin','来てくれてうれしいわ！\n俺、ナンバズのシンや\nなんでも話しかけてや〜',false); },700);
}

if(getApiKey()){ startChat(); } else { showModal(); }
</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/shin_chat/sw.js');
}
</script>
</body>
</html>
